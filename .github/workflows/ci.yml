name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.13"
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - id: py
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: "harness/uv.lock"

      - name: Cache tool venvs
        uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('tools/*/uv.lock', 'tools/*/pyproject.toml') }}

      - name: Lint
        run: |
          uvx ruff@0.14.0 check harness
          uvx ruff@0.14.0 format --check harness

      - name: Test
        run: scripts/test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: out/report.json
          if-no-files-found: warn
