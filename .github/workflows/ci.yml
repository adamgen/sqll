name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group for each workflow and ref. A new pull request run stops the old
# one. A push to main does not stop a run that has started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/adamgen/sqll-ci

jobs:
  # If a pull request changes only documents (ci/changes.py), the test,
  # report, dialect-oracle, bench-smoke, and corpus-smoke jobs do not run.
  # The image and lint jobs always run. A push always runs all jobs. The heavy jobs run
  # unless full is 'false', so an empty output gives a full run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed files
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: python3 ci/changes.py "$EVENT"

  # The image tag is a hash of all image inputs (ci/image_tag.py). Build and
  # push the image only if the registry does not have that tag.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      matrix: ${{ steps.tag.outputs.matrix }}
      bench_matrix: ${{ steps.tag.outputs.bench_matrix }}
      corpus_matrix: ${{ steps.tag.outputs.corpus_matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: |
          echo "image=$IMAGE_REPO:$(python3 ci/image_tag.py)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 ci/matrix.py)" >> "$GITHUB_OUTPUT"
          echo "bench_matrix=$(python3 ci/bench_matrix.py)" >> "$GITHUB_OUTPUT"
          echo "corpus_matrix=$(python3 ci/corpus_matrix.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: find
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE exists. The build is not necessary."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image $IMAGE does not exist. Build and push it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.find.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - if: steps.find.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max

  lint:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      # The installed tools. The test jobs that run sqll check it with the
      # binary of the build job (sqll-harness run checks each tool it runs).
      - name: Tools
        run: |
          uv run --frozen --project harness sqll-harness tools --tool sqlfluff --tool sqlfluff-rs --tool sqruff
          "$SQLL_TOOLS_DIR/sqruff/bin/sqruff" templaters

      - name: Lint
        env:
          ORACLES: >-
            scripts/sqlfluff_oracle.py scripts/sqlfluff-rule-oracle
            scripts/sqlfluff-autofix-oracle scripts/sqlfluff-templater-oracle
            scripts/sqlfluff-dialect-oracle scripts/sqlfluff-case-ids
        run: |
          uv run --frozen --project harness ruff check harness ci $ORACLES scripts/build-sqll
          uv run --frozen --project harness ruff format --check harness ci $ORACLES scripts/build-sqll

      - name: Unit tests
        env:
          SQLL_REQUIRE_TOOLS: "1"
        run: uv run --frozen --project harness pytest -q harness/tests

      # The key prefix of each harness rule fixture must agree with the
      # sqlfluff test.
      - name: Check the harness rule fixtures with the sqlfluff test
        run: >-
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" scripts/sqlfluff-rule-oracle
          --cases 'harness/tests/fixtures/rules/*.yml' --check-prefixes

      # The name prefix of each harness autofix fixture must agree with the
      # sqlfluff test.
      - name: Check the harness autofix fixtures with the sqlfluff test
        run: >-
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" scripts/sqlfluff-autofix-oracle
          --root harness/tests/fixtures/autofix --check-prefixes

      # The subpath prefix of each harness templater fixture must agree with
      # the sqlfluff test.
      - name: Check the harness templater fixtures with the sqlfluff test
        run: >-
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" scripts/sqlfluff-templater-oracle
          --root harness/tests/fixtures/templater --check-prefixes

      # The name prefix of each harness dialect fixture must agree with the
      # sqlfluff tests.
      - name: Check the harness dialect fixtures with the sqlfluff tests
        run: >-
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" scripts/sqlfluff-dialect-oracle
          --root harness/tests/fixtures/dialects --check-prefixes

      # The same checks with the Rust parser and rules (--rust), as the
      # sqlfluff-rs adapter uses them.
      - name: Check the harness fixtures with the sqlfluff test and --rust
        run: |
          py="$SQLL_TOOLS_DIR/sqlfluff-rs-oracle/bin/python"
          "$py" scripts/sqlfluff-dialect-oracle --rust \
            --root harness/tests/fixtures/dialects --check-prefixes
          "$py" scripts/sqlfluff-rule-oracle --rust \
            --cases 'harness/tests/fixtures/rules/*.yml' --check-prefixes
          "$py" scripts/sqlfluff-autofix-oracle --rust \
            --root harness/tests/fixtures/autofix --check-prefixes
          "$py" scripts/sqlfluff-templater-oracle --rust \
            --root harness/tests/fixtures/templater --check-prefixes

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the tests"

  # Build sqll (scripts/build-sqll): generate the dialect tables with the
  # pinned generator, compare them with crates/sqll_dialects/generated.json,
  # build the workspace (release, --locked) with no Python, and run the Rust
  # tests. The artifact has out/sqll/build.json and the binaries.
  build:
    needs: [changes, image]
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - name: Check that the sqlfluff submodule is clean before the build
        run: scripts/check-submodule "before the build"

      - name: Build sqll
        run: scripts/build-sqll

      - name: Check that the sqlfluff submodule is clean after the build
        run: scripts/check-submodule "after the build"

      - name: Run the Rust tests
        run: cargo test --locked

      - name: Check that the sqlfluff submodule is clean after the Rust tests
        run: scripts/check-submodule "after the Rust tests"

      - uses: actions/upload-artifact@v7
        with:
          name: sqll-build
          path: out/sqll/
          if-no-files-found: error

  # The jobs of sqll use the binary of the build job.
  test:
    needs: [changes, image, build]
    if: needs.changes.outputs.full != 'false'
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image.outputs.matrix) }}
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - if: matrix.tool == 'sqll'
        uses: actions/download-artifact@v7
        with:
          name: sqll-build
          path: out/sqll

      # An artifact does not keep the file modes.
      - name: Make the sqll binary executable
        if: matrix.tool == 'sqll'
        run: chmod +x out/sqll/bin/sqll

      - name: Run shard
        run: >-
          uv run --frozen --project harness sqll-harness run
          --suite ${{ matrix.suite }} --tool ${{ matrix.tool }}
          --shard ${{ matrix.shard }} --out out/shards/${{ matrix.name }}.json

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the run"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.name }}
          path: out/shards/${{ matrix.name }}.json
          if-no-files-found: error

  # Merge the shard reports and check the known failures over the full run.
  report:
    needs: [changes, image, test]
    if: >-
      always() && needs.changes.outputs.full != 'false' &&
      needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - uses: actions/download-artifact@v7
        with:
          pattern: shard-*
          path: out/shards
          merge-multiple: true

      - name: Merge
        run: >-
          uv run --frozen --project harness sqll-harness merge
          --expect ci/matrix.d out/shards/*.json

      - name: Check sqlfluff commit in the report
        run: |
          want=$(git rev-parse HEAD:third_party/sqlfluff)
          got=$(python3 -c 'import json; print(json.load(open("out/report.json"))["sqlfluff_ref"])')
          echo "submodule: $want, report: $got"
          test "$want" = "$got"

      - name: Summary
        run: |
          uv run --frozen --project harness sqll-harness summarize \
            out/report.json --out out/summary.json
          cat out/summary.json

      # The sqlfluff test of each rule case must give the same status.
      - name: Compare the rule results with the sqlfluff test
        run: |
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" \
            scripts/sqlfluff-rule-oracle --report out/report.json \
            --out out/oracle.jsonl
          scripts/check-submodule "after the comparison"

      # The sqlfluff test of each autofix case must give the same status.
      - name: Compare the autofix results with the sqlfluff test
        run: |
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" \
            scripts/sqlfluff-autofix-oracle --report out/report.json \
            --out out/autofix-oracle.jsonl
          scripts/check-submodule "after the comparison"

      # The sqlfluff test of each templater case must give the same status.
      - name: Compare the templater results with the sqlfluff test
        run: |
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" \
            scripts/sqlfluff-templater-oracle --report out/report.json \
            --out out/templater-oracle.jsonl
          scripts/check-submodule "after the comparison"

      # The sqlfluff tests with the Rust parser and rules (--rust) must give
      # the same status as the sqlfluff-rs results.
      - name: Compare the sqlfluff-rs results with the sqlfluff tests
        run: |
          py="$SQLL_TOOLS_DIR/sqlfluff-rs-oracle/bin/python"
          "$py" scripts/sqlfluff-rule-oracle --rust \
            --report out/report.json --out out/rs-oracle.jsonl
          "$py" scripts/sqlfluff-autofix-oracle --rust \
            --report out/report.json --out out/rs-autofix-oracle.jsonl
          "$py" scripts/sqlfluff-templater-oracle --rust \
            --report out/report.json --out out/rs-templater-oracle.jsonl
          scripts/check-submodule "after the comparison"

      # The recorded summary must be the summary of this run. To record a new
      # one, copy out/summary.json of the report artifact.
      - name: Check the recorded summary
        run: >-
          uv run --frozen --project harness sqll-harness summarize
          out/report.json --out out/summary.json
          --check results/s1/summary.json

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            out/report.json
            out/summary.json
            out/oracle.jsonl
            out/autofix-oracle.jsonl
            out/templater-oracle.jsonl
            out/rs-oracle.jsonl
            out/rs-autofix-oracle.jsonl
            out/rs-templater-oracle.jsonl
          if-no-files-found: error

      - name: Check test jobs
        if: needs.test.result != 'success'
        run: |
          echo "A test job did not succeed: ${{ needs.test.result }}"
          exit 1

  # The sqlfluff dialect tests of each dialect case must give the same status
  # as the merged report. They take some minutes, thus each tool has a job.
  dialect-oracle:
    needs: [image, report]
    name: dialect-oracle (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: sqlfluff
            venv: sqlfluff-oracle
            args: ""
          - tool: sqlfluff-rs
            venv: sqlfluff-rs-oracle
            args: --rust
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - uses: actions/download-artifact@v7
        with:
          name: report
          path: out

      - name: Compare the dialect results with the sqlfluff tests
        run: |
          "$SQLL_TOOLS_DIR/${{ matrix.venv }}/bin/python" \
            scripts/sqlfluff-dialect-oracle ${{ matrix.args }} \
            --report out/report.json \
            --out out/dialect-oracle-${{ matrix.tool }}.jsonl
          scripts/check-submodule "after the comparison"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dialect-oracle-${{ matrix.tool }}
          path: out/dialect-oracle-${{ matrix.tool }}.jsonl
          if-no-files-found: error

  # The S2 smoke benchmark (harness/bench.md): start and small, all tools,
  # 1 timed run. Locally: scripts/verify.
  bench-smoke:
    needs: [changes, image]
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - name: Run the smoke benchmark
        run: >-
          uv run --frozen --project harness sqll-harness bench run
          --profile smoke --out out/bench.json

      # The stable data of the smoke run (sqlfluff ref, tool versions and
      # settings, inputs, and the status of each result) must be that of the
      # recorded baseline. No timing is compared (harness/bench.md).
      - name: Check the smoke report against the baseline
        run: >-
          uv run --frozen --project harness sqll-harness bench check
          out/bench.json --baseline results/s2/baseline.json

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the benchmarks"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke
          path: out/bench.json
          if-no-files-found: error

  # The S2 full benchmark on a push to main and on workflow_dispatch, sharded
  # by dialect (ci/bench-matrix.json). Locally: scripts/verify --full-bench
  # or scripts/bench (no sharding).
  bench-full:
    needs: image
    if: github.event_name != 'pull_request'
    name: bench-full (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image.outputs.bench_matrix) }}
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - name: Run the benchmark shard
        run: >-
          uv run --frozen --project harness sqll-harness bench run
          --profile full --shard ${{ matrix.shard }}
          --out out/bench-shards/${{ matrix.name }}.json

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the benchmarks"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-shard-${{ matrix.name }}
          path: out/bench-shards/${{ matrix.name }}.json
          if-no-files-found: error

  # Merge the shard reports of the full benchmark into one report, and
  # compare it with the baseline.
  bench-merge:
    needs: [image, bench-full]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: bench-shard-*
          path: out/bench-shards
          merge-multiple: true

      - name: Merge
        run: >-
          uv run --frozen --project harness sqll-harness bench merge
          --expect ci/bench-matrix.json out/bench-shards/*.json
          --out out/bench.json

      # The stable data of the full run (sqlfluff ref, tool versions and
      # settings, inputs, and the status of each result) must be that of the
      # recorded baseline, with each result of it (--full). No timing is
      # compared (harness/bench.md).
      - name: Check the merged report against the baseline
        run: >-
          uv run --frozen --project harness sqll-harness bench check
          out/bench.json --baseline results/s2/baseline.json --full

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-full
          path: out/bench.json
          if-no-files-found: error

  # The S9 corpus smoke run (docs/decisions/s9-corpus.md, "Profiles"): the
  # files of 32 KiB or less, all tools, 1 timed run. Locally: scripts/verify.
  # The cache has the downloaded files; the fetch checks the sha256 of each.
  # Each artifact with a report also has the manifest and the license files.
  corpus-smoke:
    needs: [changes, image]
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - uses: actions/cache@v6
        with:
          path: out/corpus/cache
          key: corpus-smoke-${{ hashFiles('corpus/sources.json') }}

      - name: Fetch the smoke files of the corpus
        run: >-
          uv run --frozen --project harness python -m sqll_harness.corpus
          fetch --smoke

      - name: Copy the manifest and the license files
        run: >-
          uv run --frozen --project harness python -m sqll_harness.corpus
          notices --out out/corpus-notices

      - name: Run the corpus smoke profile
        run: >-
          uv run --frozen --project harness python -m sqll_harness.corpus
          run --profile smoke --out out/corpus.json

      # The stable data (sqlfluff ref, tool versions and settings, inputs, and
      # the status and unparsable segments of each result) must be that of
      # the recorded baseline. No timing is compared.
      - name: Check the corpus smoke report against the baseline
        run: >-
          uv run --frozen --project harness python -m sqll_harness.corpus
          check out/corpus.json --baseline results/S9/baseline.json

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the corpus run"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-smoke
          path: |
            out/corpus.json
            out/corpus-notices/
          if-no-files-found: error

  # The S9 full corpus run on a push to main and on workflow_dispatch, sharded
  # by file (corpus/ci-shards.json, ci/corpus_matrix.py). Locally:
  # scripts/verify --full-bench (no sharding).
  corpus-full:
    needs: image
    if: github.event_name != 'pull_request'
    name: corpus-full (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image.outputs.corpus_matrix) }}
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - uses: actions/cache@v6
        with:
          path: out/corpus/cache
          key: corpus-full-${{ matrix.name }}-${{ hashFiles('corpus/sources.json') }}

      - name: Copy the manifest and the license files
        run: >-
          uv run --frozen --project harness python -m sqll_harness.corpus
          notices --out out/corpus-notices

      # The run fetches the files of its shard.
      - name: Run the corpus shard
        run: >-
          uv run --frozen --project harness python -m sqll_harness.corpus
          run --profile full --shard ${{ matrix.shard }}
          --out out/corpus-shards/${{ matrix.name }}.json

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the corpus run"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-shard-${{ matrix.name }}
          path: |
            out/corpus-shards/${{ matrix.name }}.json
            out/corpus-notices/
          if-no-files-found: error

  # Merge the shard reports of the full corpus run into one report, and
  # compare it with the baseline.
  corpus-merge:
    needs: [image, corpus-full]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The manifest check reads the dialects of the sqlfluff submodule.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - uses: actions/download-artifact@v7
        with:
          pattern: corpus-shard-*
          path: out
          merge-multiple: true

      - name: Copy the manifest and the license files
        run: >-
          uv run --frozen --project harness python -m sqll_harness.corpus
          notices --out out/corpus-notices

      - name: Merge
        run: >-
          uv run --frozen --project harness python -m sqll_harness.corpus
          merge --expect corpus/ci-shards.json out/corpus-shards/*.json
          --out out/corpus.json

      # The stable data of the full run must be that of the recorded
      # baseline, with each result of it (--full). No timing is compared.
      - name: Check the merged corpus report against the baseline
        run: >-
          uv run --frozen --project harness python -m sqll_harness.corpus
          check out/corpus.json --baseline results/S9/baseline.json --full

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-full
          path: |
            out/corpus.json
            out/corpus-notices/
          if-no-files-found: error
