name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group for each workflow and ref. A new pull request run stops the old
# one. A push to main does not stop a run that has started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/adamgen/sqll-ci

jobs:
  # If the change has only documents (ci/changes.py), the test, report, and
  # dialect-oracle jobs do not run. The image and lint jobs always run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed files
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: python3 ci/changes.py "$EVENT" "$BEFORE"

  # The image tag is a hash of all image inputs (ci/image_tag.py). Build and
  # push the image only if the registry does not have that tag.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      matrix: ${{ steps.tag.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: |
          echo "image=$IMAGE_REPO:$(python3 ci/image_tag.py)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 ci/matrix.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: find
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE exists. The build is not necessary."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image $IMAGE does not exist. Build and push it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.find.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - if: steps.find.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max

  lint:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - name: Tools
        run: |
          uv run --frozen --project harness sqll-harness tools
          "$SQLL_TOOLS_DIR/sqruff/bin/sqruff" templaters

      - name: Lint
        env:
          ORACLES: >-
            scripts/sqlfluff_oracle.py scripts/sqlfluff-rule-oracle
            scripts/sqlfluff-autofix-oracle scripts/sqlfluff-templater-oracle
            scripts/sqlfluff-dialect-oracle scripts/sqlfluff-case-ids
        run: |
          uv run --frozen --project harness ruff check harness ci $ORACLES
          uv run --frozen --project harness ruff format --check harness ci $ORACLES

      - name: Unit tests
        env:
          SQLL_REQUIRE_TOOLS: "1"
        run: uv run --frozen --project harness pytest -q harness/tests

      # The key prefix of each harness rule fixture must agree with the
      # sqlfluff test.
      - name: Check the harness rule fixtures with the sqlfluff test
        run: >-
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" scripts/sqlfluff-rule-oracle
          --cases 'harness/tests/fixtures/rules/*.yml' --check-prefixes

      # The name prefix of each harness autofix fixture must agree with the
      # sqlfluff test.
      - name: Check the harness autofix fixtures with the sqlfluff test
        run: >-
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" scripts/sqlfluff-autofix-oracle
          --root harness/tests/fixtures/autofix --check-prefixes

      # The subpath prefix of each harness templater fixture must agree with
      # the sqlfluff test.
      - name: Check the harness templater fixtures with the sqlfluff test
        run: >-
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" scripts/sqlfluff-templater-oracle
          --root harness/tests/fixtures/templater --check-prefixes

      # The name prefix of each harness dialect fixture must agree with the
      # sqlfluff tests.
      - name: Check the harness dialect fixtures with the sqlfluff tests
        run: >-
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" scripts/sqlfluff-dialect-oracle
          --root harness/tests/fixtures/dialects --check-prefixes

      # The same checks with the Rust parser and rules (--rust), as the
      # sqlfluff-rs adapter uses them.
      - name: Check the harness fixtures with the sqlfluff test and --rust
        run: |
          py="$SQLL_TOOLS_DIR/sqlfluff-rs-oracle/bin/python"
          "$py" scripts/sqlfluff-dialect-oracle --rust \
            --root harness/tests/fixtures/dialects --check-prefixes
          "$py" scripts/sqlfluff-rule-oracle --rust \
            --cases 'harness/tests/fixtures/rules/*.yml' --check-prefixes
          "$py" scripts/sqlfluff-autofix-oracle --rust \
            --root harness/tests/fixtures/autofix --check-prefixes
          "$py" scripts/sqlfluff-templater-oracle --rust \
            --root harness/tests/fixtures/templater --check-prefixes

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the tests"

  test:
    needs: [changes, image]
    if: needs.changes.outputs.full == 'true'
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image.outputs.matrix) }}
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - name: Run shard
        run: >-
          uv run --frozen --project harness sqll-harness run
          --suite ${{ matrix.suite }} --tool ${{ matrix.tool }}
          --shard ${{ matrix.shard }} --out out/shards/${{ matrix.name }}.json

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the run"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.name }}
          path: out/shards/${{ matrix.name }}.json
          if-no-files-found: error

  # Merge the shard reports and check the known failures over the full run.
  report:
    needs: [changes, image, test]
    if: >-
      always() && needs.changes.outputs.full == 'true' &&
      needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - uses: actions/download-artifact@v7
        with:
          pattern: shard-*
          path: out/shards
          merge-multiple: true

      - name: Merge
        run: >-
          uv run --frozen --project harness sqll-harness merge
          --expect ci/matrix.json out/shards/*.json

      - name: Check sqlfluff commit in the report
        run: |
          want=$(git rev-parse HEAD:third_party/sqlfluff)
          got=$(python3 -c 'import json; print(json.load(open("out/report.json"))["sqlfluff_ref"])')
          echo "submodule: $want, report: $got"
          test "$want" = "$got"

      - name: Summary
        run: |
          uv run --frozen --project harness sqll-harness summarize \
            out/report.json --out out/summary.json
          cat out/summary.json

      # The sqlfluff test of each rule case must give the same status.
      - name: Compare the rule results with the sqlfluff test
        run: |
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" \
            scripts/sqlfluff-rule-oracle --report out/report.json \
            --out out/oracle.jsonl
          scripts/check-submodule "after the comparison"

      # The sqlfluff test of each autofix case must give the same status.
      - name: Compare the autofix results with the sqlfluff test
        run: |
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" \
            scripts/sqlfluff-autofix-oracle --report out/report.json \
            --out out/autofix-oracle.jsonl
          scripts/check-submodule "after the comparison"

      # The sqlfluff test of each templater case must give the same status.
      - name: Compare the templater results with the sqlfluff test
        run: |
          "$SQLL_TOOLS_DIR/sqlfluff-oracle/bin/python" \
            scripts/sqlfluff-templater-oracle --report out/report.json \
            --out out/templater-oracle.jsonl
          scripts/check-submodule "after the comparison"

      # The sqlfluff tests with the Rust parser and rules (--rust) must give
      # the same status as the sqlfluff-rs results.
      - name: Compare the sqlfluff-rs results with the sqlfluff tests
        run: |
          py="$SQLL_TOOLS_DIR/sqlfluff-rs-oracle/bin/python"
          "$py" scripts/sqlfluff-rule-oracle --rust \
            --report out/report.json --out out/rs-oracle.jsonl
          "$py" scripts/sqlfluff-autofix-oracle --rust \
            --report out/report.json --out out/rs-autofix-oracle.jsonl
          "$py" scripts/sqlfluff-templater-oracle --rust \
            --report out/report.json --out out/rs-templater-oracle.jsonl
          scripts/check-submodule "after the comparison"

      # The recorded summary must be the summary of this run. To record a new
      # one, copy out/summary.json of the report artifact.
      - name: Check the recorded summary
        run: >-
          uv run --frozen --project harness sqll-harness summarize
          out/report.json --out out/summary.json
          --check results/s1/summary.json

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            out/report.json
            out/summary.json
            out/oracle.jsonl
            out/autofix-oracle.jsonl
            out/templater-oracle.jsonl
            out/rs-oracle.jsonl
            out/rs-autofix-oracle.jsonl
            out/rs-templater-oracle.jsonl
          if-no-files-found: error

      - name: Check test jobs
        if: needs.test.result != 'success'
        run: |
          echo "A test job did not succeed: ${{ needs.test.result }}"
          exit 1

  # The sqlfluff dialect tests of each dialect case must give the same status
  # as the merged report. They take some minutes, thus each tool has a job.
  dialect-oracle:
    needs: [image, report]
    name: dialect-oracle (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: sqlfluff
            venv: sqlfluff-oracle
            args: ""
          - tool: sqlfluff-rs
            venv: sqlfluff-rs-oracle
            args: --rust
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - uses: actions/download-artifact@v7
        with:
          name: report
          path: out

      - name: Compare the dialect results with the sqlfluff tests
        run: |
          "$SQLL_TOOLS_DIR/${{ matrix.venv }}/bin/python" \
            scripts/sqlfluff-dialect-oracle ${{ matrix.args }} \
            --report out/report.json \
            --out out/dialect-oracle-${{ matrix.tool }}.jsonl
          scripts/check-submodule "after the comparison"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dialect-oracle-${{ matrix.tool }}
          path: out/dialect-oracle-${{ matrix.tool }}.jsonl
          if-no-files-found: error
