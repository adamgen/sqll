name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/adamgen/sqll-ci

jobs:
  # The image tag is a hash of all image inputs (ci/image_tag.py). Build and
  # push the image only if the registry does not have that tag.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      matrix: ${{ steps.tag.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: |
          echo "image=$IMAGE_REPO:$(python3 ci/image_tag.py)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 ci/matrix.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: find
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE exists. The build is not necessary."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image $IMAGE does not exist. Build and push it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.find.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - if: steps.find.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max

  lint:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - name: Tools
        run: |
          uv run --frozen --project harness sqll-harness tools
          "$SQLL_TOOLS_DIR/sqruff/bin/sqruff" templaters

      - name: Lint
        run: |
          uv run --frozen --project harness ruff check harness ci scripts/sqlfluff-rule-oracle
          uv run --frozen --project harness ruff format --check harness ci scripts/sqlfluff-rule-oracle

      - name: Unit tests
        env:
          SQLL_REQUIRE_TOOLS: "1"
        run: uv run --frozen --project harness pytest -q harness/tests

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the tests"

  test:
    needs: image
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image.outputs.matrix) }}
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - name: Run shard
        run: >-
          uv run --frozen --project harness sqll-harness run
          --suite ${{ matrix.suite }} --tool ${{ matrix.tool }}
          --shard ${{ matrix.shard }} --out out/shards/${{ matrix.name }}.json

      - name: Check that the sqlfluff submodule is clean
        run: scripts/check-submodule "after the run"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.name }}
          path: out/shards/${{ matrix.name }}.json
          if-no-files-found: error

  # Merge the shard reports and check the known failures over the full run.
  report:
    needs: [image, test]
    if: always() && needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner user owns the workspace, not the container user.
      - run: git config --global --add safe.directory '*'

      - uses: actions/download-artifact@v7
        with:
          pattern: shard-*
          path: out/shards
          merge-multiple: true

      - name: Merge
        run: >-
          uv run --frozen --project harness sqll-harness merge
          --expect ci/matrix.json out/shards/*.json

      - name: Check sqlfluff commit in the report
        run: |
          want=$(git rev-parse HEAD:third_party/sqlfluff)
          got=$(python3 -c 'import json; print(json.load(open("out/report.json"))["sqlfluff_ref"])')
          echo "submodule: $want, report: $got"
          test "$want" = "$got"

      # The sqlfluff test of each rule case must give the same status.
      - name: Compare the rule results with the sqlfluff test
        env:
          UV_PROJECT_ENVIRONMENT: /tmp/sqll-oracle
        run: |
          uv run --frozen --project tools/sqlfluff-oracle \
            scripts/sqlfluff-rule-oracle --report out/report.json \
            --out out/oracle.jsonl
          scripts/check-submodule "after the comparison"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            out/report.json
            out/oracle.jsonl
          if-no-files-found: error

      - name: Check test jobs
        if: needs.test.result != 'success'
        run: |
          echo "A test job did not succeed: ${{ needs.test.result }}"
          exit 1
