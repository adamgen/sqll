# S3b task C4: the measurement tool of the tree decision
# (docs/decisions/s3b-core.md). This is not sqll and not a harness tool.
# scripts/s3b/core_design.py builds and runs it.
#
# It links the sqll crates by path. It is its own workspace, so the sqll
# workspace and its Cargo.lock do not change. Its Cargo.lock has the crate
# versions of the sqll Cargo.lock.
[package]
name = "sqll-s3b-tree-cost"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "S3b C4 measurement, not sqll: the heap cost of the parser tree"

[workspace]

[dependencies]
serde_json = "1.0.149"
sqll_dialects = { path = "../../../crates/sqll_dialects" }
sqll_lexer = { path = "../../../crates/sqll_lexer" }
sqll_parser = { path = "../../../crates/sqll_parser" }
sqll_types = { path = "../../../crates/sqll_types" }

# The release profile of the sqll workspace, without link-time optimization
# (it does not change the allocations, and the build is faster).
[profile.release]
debug = false
strip = true

[profile.release.package.sha2]
opt-level = 3
