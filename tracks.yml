# Tracks and the paths that each track owns (PROCESS.md, "Tracks").
# The Core track owns this file. ci/ownership.py reads it.
#
# branches: the pull request branches of the track (globs). A branch that
#   no track has gets the rules of the Core track.
# paths: the paths that the track owns (globs). "*" does not match "/".
#   "**" matches zero or more folders.
#
# A path belongs to the one track other than core that matches it. If no
# such track matches it, it belongs to core if a core pattern matches it.
# Else no track owns it, and each track can change it. Two tracks other
# than core must not match the same path (harness/tests/test_ownership.py).
#
# Each track also owns its hot files: status/<track>.md,
# ci/matrix.d/<track>.json, and results/<track>/. The hot files of the Core
# track are status/S3b.md, ci/matrix.d/core.json, and results/S3b/.
# Exception: the S3 track is closed, and its fragment ci/matrix.d/S3.json
# (the CI jobs of sqll) is a core path.
#
# The ownership check uses the tracks.yml of the base of a pull request.
# If the pull request changes this file, the check also uses the new file,
# and both checks must pass. Thus a pull request cannot give its track more
# paths.

tracks:
  core:
    stones: [S3b]
    branches: [claude/core, claude/core-*, claude/s3b, claude/s3b-*]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - CONSTITUTION.md
      - PROCESS.md
      - STONES.md
      - STATUS.md
      - THIRD_PARTY.md
      - tracks.yml
      - .github/**
      - .gitignore
      - .gitmodules
      - .dockerignore
      - ci/**
      - scripts/**
      - tools/**
      - third_party/**
      - harness/**
      - known_failures/**
      - results/s1/**
      - results/s2/**
      - status/S1.md
      - status/S2.md
      - status/S3b.md
      - results/S3b/**
      # The sqll code and its live CI gates. S3 made them; S3b (task C3)
      # moved them to core when S3 was approved (STONES.md, S3b exit 3).
      # scripts/**, harness/**, ci/**, and known_failures/** above also
      # match the sqll paths in these folders (for example
      # scripts/build-sqll and ci/matrix.d/S3.json).
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - results/s3/tree-guard.json
      - results/s3/base-native-tests.json
      - results/s3/base-native-tests.log

  S3:
    # S3 is approved and closed. It keeps only its frozen records. Its
    # live code and CI gates are core paths (see core). These globs must
    # not match a core path of the sqll code or of the gates
    # (harness/tests/test_ownership.py).
    stones: [S3]
    branches: [claude/s3, claude/s3-*, claude/laughing-clarke-jkf7w5]
    paths:
      - status/S3.md
      - results/S3/**
      - docs/decisions/s3-*.md
      - results/s3/*.md
      - results/s3/capabilities*.json
      - results/s3/decision-data.json
      - results/s3/exit.json
      - results/s3/exit-inputs/**
      - results/s3/license-size*.json
      - results/s3/phase-a/**
      - results/s3/s1-by-base.json
      - results/s3/speed/**
      - results/s3/speed-*.json
      - results/s3/sqlfluffrs-probe*.json
      - results/s3/sqruff-*.json
      - scripts/s3/capabilities.py
      - scripts/s3/decision_data.py
      - scripts/s3/exit.py
      - scripts/s3/hint-check.patch
      - scripts/s3/hint_check.py
      - scripts/s3/license_size.py
      - scripts/s3/phase_a.py
      - scripts/s3/probe-sqlfluffrs/**
      - scripts/s3/s1_by_base.py
      - scripts/s3/speed_by_base.py
      - scripts/s3/speed_profile.py
      - scripts/s3/sqlfluffrs_probe.py
      - scripts/s3/sqruff_rules.py
      - scripts/s3/sqruff_trees.py
      - harness/tests/test_s3_capabilities.py
      - harness/tests/test_s3_decision_data.py
      - harness/tests/test_s3_exit.py
      - harness/tests/test_s3_hint_check.py
      - harness/tests/test_s3_license_size.py
      - harness/tests/test_s3_phase_a.py
      - harness/tests/test_s3_s1_by_base.py
      - harness/tests/test_s3_speed_*.py
      - harness/tests/test_s3_sqlfluffrs_probe.py
      - harness/tests/test_s3_sqruff_*.py
      - harness/tests/test_s3_status.py

  S7-tests:
    stones: [S7]
    branches: [claude/s7-tests, claude/s7-tests-*]
    paths:
      - status/S7-tests.md
      - ci/matrix.d/S7-tests.json
      - results/S7-tests/**
      - scripts/s7-tests/**
      - docs/decisions/s7-tests-*.md
      - harness/sqll_harness/s7_tests/**
      - harness/tests/test_s7_tests_*.py
      - harness/tests/fixtures/s7_tests/**

  S9:
    stones: [S9]
    branches: [claude/s9, claude/s9-*]
    paths:
      - status/S9.md
      - ci/matrix.d/S9.json
      - results/S9/**
      - scripts/s9/**
      - docs/decisions/s9-*.md
      - corpus/**
      - harness/sqll_harness/corpus/**
      - harness/tests/test_s9_*.py

  # Placeholders. A track starts when each stone that its stone needs is
  # approved (STONES.md). S3b adds the paths of the sqll packages that each
  # track owns.
  S4:
    stones: [S4]
    branches: [claude/s4, claude/s4-*]
    paths: [status/S4.md, ci/matrix.d/S4.json, results/S4/**]
  S5:
    stones: [S5]
    branches: [claude/s5, claude/s5-*]
    paths: [status/S5.md, ci/matrix.d/S5.json, results/S5/**]
  S6:
    stones: [S6]
    branches: [claude/s6, claude/s6-*]
    paths: [status/S6.md, ci/matrix.d/S6.json, results/S6/**]
  S7-sqll:
    stones: [S7]
    branches: [claude/s7-sqll, claude/s7-sqll-*]
    paths: [status/S7-sqll.md, ci/matrix.d/S7-sqll.json, results/S7-sqll/**]
  S8:
    stones: [S8]
    branches: [claude/s8, claude/s8-*]
    paths: [status/S8.md, ci/matrix.d/S8.json, results/S8/**]
  S10:
    stones: [S10]
    branches: [claude/s10, claude/s10-*]
    paths: [status/S10.md, ci/matrix.d/S10.json, results/S10/**]
