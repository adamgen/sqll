# The sqll binary. This file is new sqll code (crates/ported.json, "new").
[package]
name = "sqll"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false
description = "sqll: a SQL toolchain."

# Since S3b C13 the commands and the output formats are in sqll_cli (C9:
# the parse interface; C11: the config; C12: the rules).
[dependencies]
sqll_cli = { path = "../sqll_cli" }

# The tests read the JSON and YAML output and the C11 and C13 records, test
# the lazy lexers (sqll_lexer, sqll_types), the rules table (sqll_cli,
# sqll_lint), and "fix --check" on a pseudo terminal (libc).
[dev-dependencies]
libc.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sqll_dialects = { path = "../sqll_dialects" }
sqll_lexer = { path = "../sqll_lexer" }
sqll_lint = { path = "../sqll_lint" }
sqll_types = { path = "../sqll_types" }

# build.rs reads the output of "cargo metadata" (build/notices.rs).
[build-dependencies]
serde_json.workspace = true
sha2.workspace = true
