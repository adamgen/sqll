# The sqll binary. This file is new sqll code (crates/ported.json, "new").
[package]
name = "sqll"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false
description = "sqll: a SQL toolchain. Parse output in the format of sqlfluff parse -f json."

[dependencies]
serde_json.workspace = true
sqll_dialects = { path = "../sqll_dialects" }
sqll_lexer = { path = "../sqll_lexer" }
sqll_parser = { path = "../sqll_parser" }
sqll_types = { path = "../sqll_types" }

[dev-dependencies]
serde.workspace = true
serde_yaml_ng.workspace = true

# build.rs reads the output of "cargo metadata" (build/notices.rs).
[build-dependencies]
serde_json.workspace = true
sha2.workspace = true
