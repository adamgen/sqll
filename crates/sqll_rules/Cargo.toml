# This file is a port of sqlfluff 4.4.0 code (sqlfluffrs):
# sqlfluffrs/sqlfluffrs_rules/Cargo.toml
# Source: https://github.com/sqlfluff/sqlfluff, tag 4.4.0,
# commit 0348222a3bcdb0226563f7349c5a39beb0641955.
# Copyright (c) 2018-2026 Alan Cruickshank. MIT License: see
# crates/LICENSE-sqlfluffrs.md. See THIRD_PARTY.md and crates/ported.json.
# sqll changed this file. crates/ported.json gives the reason.

[package]
name = "sqll_rules"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false

# Rust-native lint rules. Detection runs over the rule interface of sqll_lint
# (the typed view of the SyntaxTree); the fix loop of sqll_lint applies the
# fixes. sqll: no Python bindings.
[dependencies]
sqll_config = { path = "../sqll_config" }
sqll_lint = { path = "../sqll_lint" }
sqll_tree = { path = "../sqll_tree" }

# The tests of sqll (tests/capitalisation.rs, tests/fixtures.rs) parse SQL with the
# raw templater and read the rule fixtures and the record of S3b C12.
[dev-dependencies]
serde_json.workspace = true
serde_yaml_ng.workspace = true
sqll_source = { path = "../sqll_source" }
sqll_syntax = { path = "../sqll_syntax" }
sqll_templater = { path = "../sqll_templater" }
