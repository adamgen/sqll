# crates/LICENSE-sqlfluffrs.md. See THIRD_PARTY.md and crates/ported.json.
# sqll changed this file. crates/ported.json gives the reason.

[package]
name = "sqll_parser"
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish = false

# The ported code uses the sqlfluffrs crate names.
[dependencies]
env_logger.workspace = true
log.workspace = true
hashbrown.workspace = true
smallvec.workspace = true
sqlfluffrs_types = { package = "sqll_types", path = "../sqll_types" }
sqlfluffrs_dialects = { package = "sqll_dialects", path = "../sqll_dialects" }
sqlfluffrs_lexer = { package = "sqll_lexer", path = "../sqll_lexer" }
uuid.workspace = true
serde_yaml_ng.workspace = true

[features]
verbose-debug = []
