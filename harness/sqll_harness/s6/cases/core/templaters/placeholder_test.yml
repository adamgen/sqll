nodes:
  - node: test/core/templaters/placeholder_test.py::test__templater_raw
    asserts:
      L14: ["templated:templated"]
    cases:
      # The templated SQL has an unparsable section in the ansi dialect:
      # parse gives the tree and exit code 1.
      - name: templated
        run: cli
        argv: [parse, -f, json, case.sql]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\ntemplater = placeholder\n\n[sqlfluff:templater:placeholder]\nparam_style = colon\n"
          case.sql: "SELECT * FROM {{blah}} WHERE %(gnepr)s OR e~':'"
        checks:
          exit_code: 1
          templated: "SELECT * FROM {{blah}} WHERE %(gnepr)s OR e~':'"
      - name: slices
        run: cli
        argv: [parse, -f, json, -m, case.sql]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\ntemplater = placeholder\n\n[sqlfluff:templater:placeholder]\nparam_style = colon\n"
          case.sql: "SELECT * FROM {{blah}} WHERE %(gnepr)s OR e~':'"
        checks:
          exit_code: 1
          source_slices:
            - ["SELECT", 0, 6]
            - ["", 6, 6]
            - [" ", 6, 7]
            - ["*", 7, 8]
            - ["", 8, 8]
            - [" ", 8, 9]
