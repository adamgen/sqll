          case.sql: SELECT 2+2
        checks:
          exit_code: 1
          stderr:
            contains: ["ValueError: No param_regex nor param_style was provided to the placeholder templater"]
      - name: both
        run: cli
        argv: [parse, -f, json, case.sql]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\ntemplater = placeholder\n\n[sqlfluff:templater:placeholder]\nparam_style = bla\nparam_regex = bli\n"
          case.sql: SELECT 2+2
        checks:
          exit_code: 1
          stderr:
            contains: ["ValueError: Either param_style or param_regex must be provided, not both"]
