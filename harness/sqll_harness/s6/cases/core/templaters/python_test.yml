# S6 black-box cases (docs/decisions/s6-templaters.md, "Black-box form"; the
# case format of docs/decisions/s7-tests-design.md, "Case format"). A
# derived work of the sqlfluff tests: copyright (c) 2018-2026 Alan
# Cruickshank, MIT License. The trace oracle gives each case from the
# process() call of its node (the templater map): the SQL file case.sql
# and the .sqlfluff file of the context and the config of the call.
source:
  project: sqlfluff
  version: 4.4.0
  commit: 0348222a3bcdb0226563f7349c5a39beb0641955
  file: test/core/templaters/python_test.py
license: MIT
nodes:
  - node: test/core/templaters/python_test.py::test__templater_python
    asserts:
      L21: ["templated:templated"]
    cases:
      - name: templated
        run: cli
        argv: [parse, -f, json, case.sql]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\ntemplater = python\n\n[sqlfluff:templater:python:context]\nblah = foo\n"
          case.sql: "SELECT * FROM {blah}"
        checks:
          exit_code: 0
          templated: "SELECT * FROM foo"
      - name: slices
        run: cli
        argv: [parse, -f, json, -m, case.sql]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\ntemplater = python\n\n[sqlfluff:templater:python:context]\nblah = foo\n"
          case.sql: "SELECT * FROM {blah}"
        checks:
          exit_code: 0
          source_slices:
            - ["SELECT", 0, 6]
            - ["", 6, 6]
            - [" ", 6, 7]
            - ["*", 7, 8]
            - ["", 8, 8]
            - [" ", 8, 9]
            - ["FROM", 9, 13]
            - [" ", 13, 14]
            - ["", 14, 14]
            - ["foo", 14, 20]
            - ["", 20, 20]
            - ["", 20, 20]
  - node: test/core/templaters/python_test.py::test__templater_python_error
    asserts:
      L28:raises: ["missing:exit_code", "missing:violations[0]"]
    cases:
      # A SQLTemplaterError: the TMP violation of lint.
      - name: missing
        run: cli
        argv: [lint, -f, json, case.sql]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\ntemplater = python\n\n[sqlfluff:templater:python:context]\nnoblah = foo\n"
          case.sql: "SELECT * FROM {blah}"
        checks:
          exit_code: 1
          violations:
            - select: {code: TMP}
              records:
                - description: {contains: "Failure in Python templating: 'blah'."}
  - node: test/core/templaters/python_test.py::test__templater_python_large_file_check
    asserts:
      L489:raises: ["skip:stdout.json", "skip:stderr.contains[0]"]
      L498: ["skip:stderr.contains[0]"]
    cases:
      # The first process() call has no config. The case gives the dialect
      # ansi, because the CLI needs a dialect. The call returns the input.
      - name: templated
        run: cli
        argv: [parse, -f, json, case.sql]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\ntemplater = python\n"
          case.sql: "SELECT 1"
        checks:
          exit_code: 0
          templated: "SELECT 1"
      - name: slices
        run: cli
        argv: [parse, -f, json, -m, case.sql]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\ntemplater = python\n"
          case.sql: "SELECT 1"
        checks:
          exit_code: 0
          source_slices:
            - ["SELECT", 0, 6]
            - ["", 6, 6]
            - [" ", 6, 7]
            - ["1", 7, 8]
            - ["", 8, 8]
            - ["", 8, 8]
      # A SQLFluffSkipFile: the CLI skips the file with a warning, gives
      # no parse tree, and exit code 0.
      - name: skip
        run: cli
        argv: [parse, -f, json, case.sql]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\nlarge_file_skip_char_limit = 2\ntemplater = python\n"
          case.sql: "SELECT 1"
        checks:
          exit_code: 0
          stdout:
            json: [{filepath: case.sql, segments: null}]
          stderr:
            contains: ["Length of file 'case.sql' is over 2 characters."]
