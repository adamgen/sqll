nodes:
  - node: test/cli/commands_test.py::test__cli__command_directed
    asserts:
      L90:ret_code: ["directed:exit_code"]
      L104: ["directed:stdout.contains[0]"]
      L105: ["directed:stdout.contains[1]"]
      L108: ["directed:stdout.startswith"]
    cases:
      - name: directed
        run: cli
        argv:
          - lint
          - --disable-progress-bar
          - test/fixtures/linter/indentation_error_simple.sql
        sqruff: [lint, test/fixtures/linter/indentation_error_simple.sql]
        checks:
          exit_code: 1
          stdout:
            contains: ["L:   2 | P:   1 | LT02", ndentation]
            startswith: "== [test/fixtures/linter/indentation_error_simple.sql] FAIL\nL:   2 | P:   1 | LT02 | Expected indent of 4 spaces. [layout.indent]\nL:   5 | P:  10 | CP01 | Keywords must be consistently upper case.\n                       | [capitalisation.keywords]\n"
  - node: test/cli/commands_test.py::test__cli__command_dialect
    asserts:
      L114:ret_code: ["unknown_dialect:exit_code"]
    cases:
      - name: unknown_dialect
        run: cli
        argv:
          - lint
          - -n
          - --dialect
          - faslkjh
          - test/fixtures/linter/indentation_error_simple.sql
        sqruff:
          - lint
          - --dialect
          - faslkjh
          - test/fixtures/linter/indentation_error_simple.sql
        checks:
          exit_code: 2
  - node: test/cli/commands_test.py::test__cli__command_no_dialect[command0]
