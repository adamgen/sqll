            contains: [User Error, No dialect was specified]
            not_contains: [Traceback (most recent call last)]
  - node: test/cli/commands_test.py::test__cli__command_no_dialect[command4]
    cases:
      - name: no_dialect_fix
        run: cli
        argv: [fix, "-"]
        stdin: SELECT 1
        checks:
          exit_code: 2
          stderr:
            contains: [User Error, No dialect was specified]
            not_contains: [Traceback (most recent call last)]
  - node: test/cli/commands_test.py::test__cli__command_version
    cases:
      - name: version
        run: cli
        argv: [version]
        checks:
          exit_code: 0
          stdout:
            contains: [4.4.0]
      - name: version_verbose
        run: cli
        argv: [version, -v]
        checks:
          exit_code: 0
          stdout:
            contains: [4.4.0]
