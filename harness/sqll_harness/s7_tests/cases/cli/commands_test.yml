          stderr:
            contains: [User Error, No dialect was specified]
            not_contains: [Traceback (most recent call last)]
  - node: test/cli/commands_test.py::test__cli__command_no_dialect[command2]
    cases:
      - name: no_dialect_lint
        run: cli
        argv: [lint, "-"]
        stdin: SELECT 1
        checks:
          exit_code: 2
          stderr:
            contains: [User Error, No dialect was specified]
            not_contains: [Traceback (most recent call last)]
  - node: test/cli/commands_test.py::test__cli__command_no_dialect[command3]
    cases:
      - name: no_dialect_format
        run: cli
        argv: [format, "-"]
