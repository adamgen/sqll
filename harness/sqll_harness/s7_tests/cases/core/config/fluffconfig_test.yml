nodes:
  - node: test/core/config/fluffconfig_test.py::test__config__glob_exclude_config_tests
    asserts:
      L121: ["glob_exclude:violations[0]"]
      L122: ["glob_exclude:violations[1]"]
      L123: ["glob_exclude:violations[2]"]
      L124: ["glob_exclude:violations[3]"]
      L125: ["glob_exclude:violations[4]"]
    cases:
      # The tool reads the config files of the fixture folder, as
      # FluffConfig.from_path does. test/fixtures/.sqlfluff sets the dialect.
      - name: glob_exclude
        run: cli
        argv: [lint, -f, json, test/fixtures/config/glob_exclude/test.sql]
        checks:
          exit_code: 1
          violations:
            - select: {code: AM04, start_line_no: 12, start_line_pos: 8}
              min_count: 1
            - select: {code: RF02}
              count: 0
            - select: {code: LT13}
              count: 0
            - select: {code: AM05}
              count: 0
            - select: {code: CV06}
              count: 0
  - node: test/core/config/fluffconfig_test.py::test__config__glob_include_config_tests
    asserts:
      L138: ["glob_include:violations[0]"]
      L139: ["glob_include:violations[1]"]
      L140: ["glob_include:violations[2]"]
      L141: ["glob_include:violations[3]"]
      L142: ["glob_include:violations[4]"]
    cases:
      - name: glob_include
        run: cli
        argv: [lint, -f, json, test/fixtures/config/glob_include/test.sql]
        checks:
          exit_code: 1
          violations:
            - select: {code: LT13, start_line_no: 1, start_line_pos: 1}
              min_count: 1
            - select: {code: AM05, start_line_no: 14, start_line_pos: 1}
              min_count: 1
            - select: {code: CV06, start_line_no: 14, start_line_pos: 9}
              min_count: 1
            - select: {code: RF02, start_line_no: 12, start_line_pos: 8}
              min_count: 1
            - select: {code: AM04}
              count: 0
