source:
  project: sqlfluff
  version: 4.4.0
  commit: 0348222a3bcdb0226563f7349c5a39beb0641955
  file: test/core/config/fluffconfig_test.py
license: MIT
nodes:
  - node: test/core/config/fluffconfig_test.py::test__config__glob_exclude_config_tests
    asserts:
      L121: ["glob_exclude:violations[0]"]
      L122: ["glob_exclude:violations[1]"]
      L123: ["glob_exclude:violations[2]"]
      L124: ["glob_exclude:violations[3]"]
      L125: ["glob_exclude:violations[4]"]
    cases:
      # The tool reads the config files of the fixture folder, as
      # FluffConfig.from_path does. test/fixtures/.sqlfluff sets the dialect.
      - name: glob_exclude
        run: cli
        argv: [lint, -f, json, test/fixtures/config/glob_exclude/test.sql]
        checks:
          exit_code: 1
          violations:
            - select: {code: AM04, start_line_no: 12, start_line_pos: 8}
              min_count: 1
            - select: {code: RF02}
              count: 0
            - select: {code: LT13}
              count: 0
            - select: {code: AM05}
              count: 0
            - select: {code: CV06}
              count: 0
  - node: test/core/config/fluffconfig_test.py::test__config__glob_include_config_tests
    asserts:
      L138: ["glob_include:violations[0]"]
      L139: ["glob_include:violations[1]"]
      L140: ["glob_include:violations[2]"]
      L141: ["glob_include:violations[3]"]
      L142: ["glob_include:violations[4]"]
    cases:
      - name: glob_include
        run: cli
        argv: [lint, -f, json, test/fixtures/config/glob_include/test.sql]
        checks:
          exit_code: 1
          violations:
            - select: {code: LT13, start_line_no: 1, start_line_pos: 1}
              min_count: 1
            - select: {code: AM05, start_line_no: 14, start_line_pos: 1}
              min_count: 1
            - select: {code: CV06, start_line_no: 14, start_line_pos: 9}
              min_count: 1
            - select: {code: RF02, start_line_no: 12, start_line_pos: 8}
              min_count: 1
            - select: {code: AM04}
              count: 0
  # T19 (trace oracle and case runner, extension 4; goal: the trace oracle
  # maps and proves each config call of the config nodes that a CLI command
  # shows, and fails closed on each other call): 2 proof nodes of the error
  # map of a FluffConfig construction. The trace records the error and runs
  # "lint -" in a new folder with the inputs of the construction: the configs
  # (with the overrides in [sqlfluff]) as the .sqlfluff file, or the
  # arguments of FluffConfig.from_kwargs as lint options. The CLI gives the
  # same error first, so the trace oracle maps the error to the case.
  #
  # FluffConfig(configs=...) with the removed value rules:L003:
  # lint_templated_tokens. The CLI loads the .sqlfluff file with
  # FluffConfig.from_root; its message names that file where the message of
  # the test names '<provided configs>'.
  - node: test/core/config/fluffconfig_test.py::test__config__validate_configs_indirect
    asserts:
      L247:raises: ["outdated:exit_code", "outdated:stdout.contains[0]"]
    cases:
      - name: outdated
        run: cli
        argv: [lint, "-"]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\n\n[sqlfluff:rules:L003]\nlint_templated_tokens = True\n"
        stdin: ""
        checks:
          exit_code: 2
          stdout:
            contains:
              - "Error loading config: Config file '{tmp}/.sqlfluff' set an outdated config value rules:L003:lint_templated_tokens.\n"
  # FluffConfig.from_kwargs() with no dialect. Each CLI command loads its
  # config with require_dialect=False and checks the dialect later
  # (FluffConfig.verify_dialect_specified): the same error, as a user error
  # on stderr with exit code 2.
  - node: test/core/config/fluffconfig_test.py::test__config_missing_dialect
    asserts:
      L239:raises: ["no_dialect:exit_code", "no_dialect:stderr.contains[0]"]
      L241: ["no_dialect:stderr.contains[0]"]
    cases:
      - name: no_dialect
        run: cli
        argv: [lint, "-"]
        cwd: tmp
        stdin: ""
        checks:
          exit_code: 2
          stderr:
            contains:
              - "User Error: No dialect was specified. You must configure a dialect or specify one on the command line using --dialect after the command."
