    asserts:
      L46: ["union_all_in_subquery_fix:fixed"]
    cases:
      - name: union_all_in_subquery_fix
        run: api
        function: fix
        sql: "SELECT c FROM (\n    SELECT 'g' UNION ALL\n    SELECT 'h'\n    UNION ALL SELECT 'j'\n)\n"
        checks:
          fixed: "SELECT c FROM (\n    SELECT 'g'\n    UNION ALL\n    SELECT 'h'\n    UNION ALL\n    SELECT 'j'\n)\n"
