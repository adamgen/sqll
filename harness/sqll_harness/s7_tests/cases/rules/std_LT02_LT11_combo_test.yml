    cases:
      - name: union_all_in_subquery_lint
        run: api
        function: lint
        sql: "SELECT * FROM (\n    SELECT 'g' UNION ALL\n    SELECT 'h'\n    UNION ALL SELECT 'j'\n)\n"
        checks:
          violations:
            - select: {code: LT11}
              min_count: 1
