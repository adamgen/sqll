        stdin: "with cte1 as (\nselect \"a\"\n      ,\"b\"\n      ,coalesce(\"g1\"\n               ,\"g2\"\n               ,\"g3\"\n       ) as \"g_combined\"\n\n      ,\"i\"\n      ,\"j\"\n  from test\n),\n\ncte2 as (\nselect \"col1\"\n\n      ,'start: ' + \"col2\" as \"new_col2\"\n\n      ,'start2: ' + \"col3\" as \"new_col3\"\n\n      ,\"col4\"\n      ,\"col5\"\nfrom cte1\n)\n\nselect * from cte2"
        checks:
          exit_code: 0
          stdout: {equals: "with cte1 as (\nselect \"a\",\n      \"b\",\n      \"i\",\n\n      \"j\",\n      coalesce(\"g1\",\n               \"g2\",\n               \"g3\"\n       ) as \"g_combined\"\n  from test\n),\n\ncte2 as (\nselect \"col1\",\n\n      \"col4\",\n\n      \"col5\",\n\n      'start: ' + \"col2\" as \"new_col2\",\n      'start2: ' + \"col3\" as \"new_col3\"\nfrom cte1\n)\n\nselect * from cte2"}
