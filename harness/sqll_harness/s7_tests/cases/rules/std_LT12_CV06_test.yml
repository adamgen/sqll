# Cruickshank, MIT License.
# test__rules__std_LT12_and_CV06_interaction sets require_final_semicolon on a
# config and calls Linter(config=cfg).lint_string(sql, fix=True). The trace
# oracle maps each Linter string call to "lint -f json -" (and "fix -" if the
# call fixes) on stdin in a temporary folder, with the config of the Linter as
# a .sqlfluff file (the config model of the design record). The violations
# check gives the codes of sqlfluff 4.4.0 in the order of the lint output; the
# source checks only the set of the codes. Thus the check is stronger than its
# assert. T7 (convert the rule tests, part 2; goal: the other rule nodes, not
# Rust dispatch and not Jinja, are black-box cases) of S7 (CLI and config
# parity: the sqlfluff CLI, config, and Python rule tests as black-box cases;
# sqll passes 100% of the converted cases; cases that need the Jinja templater
# move to the Jinja templater stone) converts it.
source:
  project: sqlfluff
  version: 4.4.0
  commit: 0348222a3bcdb0226563f7349c5a39beb0641955
  file: test/rules/std_LT12_CV06_test.py
license: MIT
nodes:
  - node: "test/rules/std_LT12_CV06_test.py::test__rules__std_LT12_and_CV06_interaction"
    asserts:
      L23: ["lint:violations[0]"]
      L26: ["fix:stdout.equals"]
    cases:
      - name: lint
        run: cli
        argv: [lint, "-f", json, "-"]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\n\n[sqlfluff:rules:convention.terminator]\nrequire_final_semicolon = 1\n"
        stdin: "SELECT foo FROM bar"
        checks:
          exit_code: 1
          violations:
            - records:
                - {code: CV06}
                - {code: LT12}
      - name: fix
        run: cli
        argv: [fix, "-"]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\n\n[sqlfluff:rules:convention.terminator]\nrequire_final_semicolon = 1\n"
        stdin: "SELECT foo FROM bar"
        checks:
          exit_code: 0
          stdout: {equals: "SELECT foo FROM bar;\n"}
