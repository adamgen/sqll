# S7 black-box cases (docs/decisions/s7-tests-design.md, "Case format").
# A derived work of the sqlfluff tests: copyright (c) 2018-2026 Alan
# Cruickshank, MIT License.
# test__rules__std_AL09_CP02_RF06 makes Linter(dialect=..., rules=...) and
# calls lint_string(sql, fix=True), then lint_string(fixed). The trace proves
# that the config of this Linter is FluffConfig(overrides=<dialect, rules>)
# and maps each call to "lint -f json -" (and "fix -" with fix) on stdin in a
# temporary folder, with the config as a .sqlfluff file (the config model of
# the design record). T17 (trace oracle and case runner, extension 2; goal:
# the trace oracle maps and proves the calls of the remaining rule nodes that
# T16 did not map, and fails closed on each other call) of S7 (CLI and config
# parity: the sqlfluff CLI, config, and Python rule tests as black-box cases;
# sqll passes 100% of the converted cases; cases that need the Jinja templater
# move to the Jinja templater stone) converted the node rules0 as a proof node
# of this map, and T7 (convert the rule tests, part 2; goal: the other rule
# nodes, not Rust dispatch and not Jinja, are black-box cases) of S7 (CLI and
# config parity: the sqlfluff CLI, config, and Python rule tests as black-box
# cases; sqll passes 100% of the converted cases; cases that need the Jinja
# templater move to the Jinja templater stone) converts 5 other nodes. T22
# (convert the rule tests, part 3; goal: each other rule node, not Rust
# dispatch, is a black-box case or is excluded with a class) of S7 (CLI and
# config parity: the sqlfluff CLI, config, and Python rule tests as black-box
# cases; sqll passes 100% of the converted cases; cases that need the Jinja
# templater move to the Jinja templater stone) converts the nodes rules3,
# rules6, rules7, and rules8. The violations of their fix run are not those of
# a lint run (the lint run has 1 more CP02 violation, at line 11, position
# 10), so the lint command cannot show them. The trace records each read of the result of the fix run after
# the call: the node reads only fix_string(). Thus the fix call maps only to
# its fix case, and these nodes have no lint case of the input
# (status/S7-tests.md).
