# test__rules__std_file calls the test helper
# assert_rule_raises_violations_in_file. The trace oracle maps it to its one
# Linter path call, "lint -f json --dialect ansi --rules <rule> <file>" in the
# sqlfluff root; the fixture files are read in place. The helper asserts that
# the set of (code, line, position) of the violations is the expected set. The
# records check gives each violation of sqlfluff 4.4.0 in the order of the
# lint output (the same set). The fixture heavy_templating.sql has Jinja tags:
# that node moves to S11. test_improper_configs_are_rejected expects a
# ValueError from get_ruleset().get_rulepack(config). The trace records the
# error and runs "lint -" in a new folder with the config as a .sqlfluff file
# (the config model of the design record). The CLI run raises the same error
# in the same function, and the CLI gives it as "User Error" with exit code 2.
# Thus the trace oracle maps the error to this case. T17 (trace oracle and
# case runner, extension 2; goal: the trace oracle maps and proves the calls
# of the remaining rule nodes that T16 did not map, and fails closed on each
# other call) of S7 (CLI and config parity: the sqlfluff CLI, config, and
# Python rule tests as black-box cases; sqll passes 100% of the converted
# cases; cases that need the Jinja templater move to the Jinja templater
# stone) converted the node rule_config_dict3 as a proof node of this map, and
# T7 (convert the rule tests, part 2; goal: the other rule nodes, not Rust
# dispatch and not Jinja, are black-box cases) of S7 (CLI and config parity:
# the sqlfluff CLI, config, and Python rule tests as black-box cases; sqll
# passes 100% of the converted cases; cases that need the Jinja templater move
# to the Jinja templater stone) converts the other nodes but
# rule_config_dict7. T22 (convert the rule tests, part 3; goal: each other rule
# node, not Rust dispatch, is a black-box case or is excluded with a class) of
# S7 (CLI and config parity: the sqlfluff CLI, config, and Python rule tests
# as black-box cases; sqll passes 100% of the converted cases; cases that need
# the Jinja templater move to the Jinja templater stone) converts
# rule_config_dict7: the key rules:capitalisation.functions:
# capitalisation_policy, which the default config does not have, is an extra
# key of the config model (status/S7-tests.md).
source:
  project: sqlfluff
