# Cruickshank, MIT License.
# test__rules__std_LT03_trailing calls Linter(config=FluffConfig(...))
# .lint_string_wrapped(sql). The trace oracle maps the call to "lint -f json -"
# on stdin in a temporary folder, with the config as a .sqlfluff file (the
# config model of the design record). T16 (trace oracle and case runner,
# extension 1; goal: the trace oracle maps and proves the calls that the
# remaining rule nodes use, and fails closed on each other call) of S7 (CLI
# and config parity: the sqlfluff CLI, config, and Python rule tests as
# black-box cases; sqll passes 100% of the converted cases; cases that need
# the Jinja templater move to the Jinja templater stone) converts it as a
# proof node of this map. The node test__rules__std_LT03_leading is not
# converted yet.
source:
  project: sqlfluff
  version: 4.4.0
  commit: 0348222a3bcdb0226563f7349c5a39beb0641955
  file: test/rules/std_LT03_test.py
license: MIT
nodes:
  - node: test/rules/std_LT03_test.py::test__rules__std_LT03_default
    asserts:
      L27: ["default:violations[0]"]
      L28: ["default:violations[1]"]
    cases:
      - name: default
        run: api
        function: lint
        sql: "\n        SELECT\n            a,\n            b\n        FROM foo\n        WHERE\n            a = 1 AND\n            b = 2\n    "
        checks:
          violations:
            - select: {code: LT03}
              min_count: 1
            - select:
                description: Found trailing binary operator. Expected only leading near line breaks.
              min_count: 1
  - node: test/rules/std_LT03_test.py::test__rules__std_LT03_trailing
    asserts:
      L75: ["trailing:violations[0]"]
      L76: ["trailing:violations[1]"]
    cases:
      - name: trailing
        run: cli
        argv: [lint, -f, json, "-"]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\n\n[sqlfluff:layout:type:binary_operator]\nline_position = trailing\n"
        stdin: "\n        SELECT\n            a,\n            b\n        FROM foo\n        WHERE\n            a = 1\n            AND b = 2\n    "
        checks:
          exit_code: 1
          violations:
            - select: {code: LT03}
              min_count: 1
            - select:
                description: Found leading binary operator. Expected only trailing near line breaks.
              min_count: 1
