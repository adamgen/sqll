# test_rules_std_LT02_LT04_interaction_indentation_leading calls
# Linter(config=FluffConfig.from_string(...)).lint_string(sql, fix=True). The
# trace oracle maps each Linter string call to "lint -f json -" (and "fix -"
# if the call fixes) on stdin in a temporary folder, with the config of the
# Linter as a .sqlfluff file (the config model of the design record). The
# violations check gives the codes of sqlfluff 4.4.0 in the order of the lint
# output; the source checks only the set of the codes. Thus the check is
# stronger than its assert. T7 (convert the rule tests, part 2; goal: the
# other rule nodes, not Rust dispatch and not Jinja, are black-box cases) of
# S7 (CLI and config parity: the sqlfluff CLI, config, and Python rule tests
# as black-box cases; sqll passes 100% of the converted cases; cases that need
# the Jinja templater move to the Jinja templater stone) converts it.
source:
  project: sqlfluff
  version: 4.4.0
  commit: 0348222a3bcdb0226563f7349c5a39beb0641955
  file: test/rules/std_LT02_LT04_test.py
license: MIT
nodes:
  - node: "test/rules/std_LT02_LT04_test.py::test_rules_std_LT02_LT04_interaction_indentation_leading[SELECT\\n    acct_id,\\n    date_x,\\n    't' AS test,\\n\\n    CASE\\n        WHEN condition_1 = '1' THEN ''\\n        ELSE condition_1\\n    END AS case_1,\\n\\n    CASE\\n        WHEN condition_2 = '2' THEN ''\\n        ELSE condition_2\\n    END AS case_2,\\n    dollar_amt,\\nFROM\\n    table_x-SELECT\\n    acct_id\\n    , date_x\\n    , 't' AS test\\n\\n    , CASE\\n        WHEN condition_1 = '1' THEN ''\\n        ELSE condition_1\\n    END AS case_1\\n\\n    , CASE\\n        WHEN condition_2 = '2' THEN ''\\n        ELSE condition_2\\n    END AS case_2\\n    , dollar_amt,\\nFROM\\n    table_x]"
    asserts:
      L69: ["lint:violations[0]"]
      L72: ["fix:stdout.equals"]
    cases:
      - name: lint
        run: cli
        argv: [lint, "-f", json, "-"]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = snowflake\nrules = LT02, LT04\n\n[sqlfluff:layout:type:comma]\nline_position = leading\n"
        stdin: "SELECT\n    acct_id,\n    date_x,\n    't' AS test,\n\n    CASE\n        WHEN condition_1 = '1' THEN ''\n        ELSE condition_1\n    END AS case_1,\n\n    CASE\n        WHEN condition_2 = '2' THEN ''\n        ELSE condition_2\n    END AS case_2,\n    dollar_amt,\nFROM\n    table_x"
        checks:
          exit_code: 1
          violations:
            - records:
                - {code: LT04}
                - {code: LT04}
                - {code: LT04}
                - {code: LT04}
                - {code: LT04}
      - name: fix
        run: cli
        argv: [fix, "-"]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = snowflake\nrules = LT02, LT04\n\n[sqlfluff:layout:type:comma]\nline_position = leading\n"
        stdin: "SELECT\n    acct_id,\n    date_x,\n    't' AS test,\n\n    CASE\n        WHEN condition_1 = '1' THEN ''\n        ELSE condition_1\n    END AS case_1,\n\n    CASE\n        WHEN condition_2 = '2' THEN ''\n        ELSE condition_2\n    END AS case_2,\n    dollar_amt,\nFROM\n    table_x"
        checks:
          exit_code: 0
          stdout: {equals: "SELECT\n    acct_id\n    , date_x\n    , 't' AS test\n\n    , CASE\n        WHEN condition_1 = '1' THEN ''\n        ELSE condition_1\n    END AS case_1\n\n    , CASE\n        WHEN condition_2 = '2' THEN ''\n        ELSE condition_2\n    END AS case_2\n    , dollar_amt,\nFROM\n    table_x"}
