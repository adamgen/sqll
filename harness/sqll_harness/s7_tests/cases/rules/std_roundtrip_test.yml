      L45: ["lint_after:exit_code"]
    cases:
      - name: lint_before
        run: cli
        argv: [lint, --rules, LT01, --dialect=ansi, "{tmp}/testing.sql"]
        cwd: tmp
        files:
          testing.sql: "SELECT\n    a.id   , -- Comma with leading spaces\n    a.name,    a.training_spaces\n,    -- Comma on newline, trailing spaces but with comment!\n    a.normal_comma, a.should_work\nFROM tbl as a\n"
        checks:
          exit_code: 1
      - name: fix
        run: cli
        argv: [fix, --rules, LT01, --dialect=ansi, -f, "{tmp}/testing.sql"]
        cwd: tmp
        files:
          testing.sql: "SELECT\n    a.id   , -- Comma with leading spaces\n    a.name,    a.training_spaces\n,    -- Comma on newline, trailing spaces but with comment!\n    a.normal_comma, a.should_work\nFROM tbl as a\n"
        checks:
          exit_code: 0
          files:
            testing.sql: "SELECT\n    a.id, -- Comma with leading spaces\n    a.name, a.training_spaces\n,    -- Comma on newline, trailing spaces but with comment!\n    a.normal_comma, a.should_work\nFROM tbl as a\n"
      - name: lint_after
