# S7 black-box cases (docs/decisions/s7-tests-design.md, "Case format").
# A derived work of the sqlfluff tests: copyright (c) 2018-2026 Alan
# Cruickshank, MIT License.
# test__cli__command__fix copies a fixture file to a new temporary folder,
# then runs lint, fix, and lint on it with CliRunner. The trace oracle maps
# each call to a cwd: tmp case: the files of the folder before the call are
# the case files, and the files after the call are the files check. T16 (trace
# oracle and case runner, extension 1; goal: the trace oracle maps and proves
# the calls that the remaining rule nodes use, and fails closed on each other
# call) of S7 (CLI and config parity: the sqlfluff CLI, config, and Python
# rule tests as black-box cases; sqll passes 100% of the converted cases;
# cases that need the Jinja templater move to the Jinja templater stone)
# converted one node as a proof node of this map, and T7 (convert the rule
# tests, part 2; goal: the other rule nodes, not Rust dispatch and not Jinja,
# are black-box cases) of S7 (CLI and config parity: the sqlfluff CLI, config,
# and Python rule tests as black-box cases; sqll passes 100% of the converted
# cases; cases that need the Jinja templater move to the Jinja templater
# stone) converts the other 5 nodes of test__cli__command__fix. The text of
# each file is the text of the fixture before and after the fix of sqlfluff
# 4.4.0. The fix check is stronger than the source assert (exit code 0): the
# source checks the fixed file only with the third call, whose input is the
# fixed file. The 2 nodes of test__cli__command__fix_templated are not
# converted: their temporary folder has a .sqlfluff file, and the calls run in
# the sqlfluff root (status/S7-tests.md).
source:
  project: sqlfluff
