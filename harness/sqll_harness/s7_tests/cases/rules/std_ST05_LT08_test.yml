source:
  project: sqlfluff
  version: 4.4.0
  commit: 0348222a3bcdb0226563f7349c5a39beb0641955
  file: test/rules/std_ST05_LT08_test.py
license: MIT
nodes:
  - node: "test/rules/std_ST05_LT08_test.py::test__rules__std_ST05_LT08_5265"
    asserts:
      L71: ["fix:stdout.equals"]
    cases:
      - name: lint
        run: cli
        argv: [lint, "-f", json, "-"]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\nrules = ST05,LT08\n"
        stdin: "\nWITH\ncte1 AS (\n    SELECT COUNT(*) AS qty\n    FROM some_table AS st\n    LEFT JOIN (\n        SELECT 'first' AS id\n    ) AS oops\n    ON st.id = oops.id\n),\ncte2 AS (\n    SELECT COUNT(*) AS other_qty\n    FROM other_table AS sot\n    LEFT JOIN (\n        SELECT 'middle' AS id\n    ) AS another\n    ON sot.id = another.id\n    LEFT JOIN (\n        SELECT 'last' AS id\n    ) AS oops\n    ON sot.id = oops.id\n)\nSELECT CURRENT_DATE();\n"
        checks:
          exit_code: 1
      - name: fix
        run: cli
        argv: [fix, "-"]
        cwd: tmp
        files:
          .sqlfluff: "[sqlfluff]\ndialect = ansi\nrules = ST05,LT08\n"
        stdin: "\nWITH\ncte1 AS (\n    SELECT COUNT(*) AS qty\n    FROM some_table AS st\n    LEFT JOIN (\n        SELECT 'first' AS id\n    ) AS oops\n    ON st.id = oops.id\n),\ncte2 AS (\n    SELECT COUNT(*) AS other_qty\n    FROM other_table AS sot\n    LEFT JOIN (\n        SELECT 'middle' AS id\n    ) AS another\n    ON sot.id = another.id\n    LEFT JOIN (\n        SELECT 'last' AS id\n    ) AS oops\n    ON sot.id = oops.id\n)\nSELECT CURRENT_DATE();\n"
        checks:
          exit_code: 1
          stdout: {equals: "\nWITH oops AS (\n        SELECT 'first' AS id\n    ),\n\ncte1 AS (\n    SELECT COUNT(*) AS qty\n    FROM some_table AS st\n    LEFT JOIN oops\n    ON st.id = oops.id\n),\n\nanother AS (\n        SELECT 'middle' AS id\n    ),\n\ncte2 AS (\n    SELECT COUNT(*) AS other_qty\n    FROM other_table AS sot\n    LEFT JOIN another\n    ON sot.id = another.id\n    LEFT JOIN (\n        SELECT 'last' AS id\n    ) AS oops\n    ON sot.id = oops.id\n)\n\nSELECT CURRENT_DATE();\n"}
