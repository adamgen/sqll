nodes:
  - node: test/rules/std_LT04_test.py::test__rules__std_LT04_unparseable
    asserts:
      L38: ["unparseable:violations[0]"]
    cases:
      - name: unparseable
        run: api
        function: lint
        # The SQL has Jinja tags: the node moves to S11.
        needs_jinja: true
        sql: "\n        SELECT\n          user_id,\n          campaign_id,\n          business_type,\n          SPLIT(intents, \",\") AS intent_list,\n          {% for feature in readability_features_numeric %}\n            CAST(JSON_EXTRACT(readability_scores,\n            '$.data.{{feature}}') AS float64) AS {{feature}} {% if not loop.last %} ,\n            {% endif %}\n          {% endfor %},\n          {% for feature in readability_features_count_list %}\n            CAST(JSON_EXTRACT(asset_structure,\n            '$.{{feature}}') AS float64) AS {{feature}}_count {% if not loop.last %} ,\n            {% endif %}\n          {% endfor %},\n            track_clicks_text,\n            track_clicks_html\n        FROM\n          t\n    "
        checks:
          violations:
            - select: {code: LT04}
              count: 0
