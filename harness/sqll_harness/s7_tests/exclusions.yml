# The S7 nodes that the harness cannot run through a binary, each with its
# class (docs/decisions/s7-tests-design.md, "Exclusions"). They are apart
# from parity. A node of class needs-python-runtime or environment needs a
# reason of one line.
excluded:
  - node: test/cli/commands_test.py::test__get_filtered_parse_violations_caches_rulepack_per_config
    class: python-internal
    reason: A spy counts the calls of Linter.get_rulepack in an internal function.
  - node: test/cli/commands_test.py::test___main___help
    class: needs-python-runtime
    reason: It runs "python -m sqlfluff --help", the entry point of the Python module.
  - node: test/rules/std_AM09_test.py::test__rules__std_AM09_eval_short_circuit_on_non_select_segment
    class: python-internal
    reason: It calls Rule_AM09._eval on a fake segment and calls no CLI command and no simple-API function.
  - node: test/rules/cp01_rust_dispatch_test.py::test__cp01_dispatch__ignore_words_parity
    class: engine-comparison
    reason: It compares use_rust_rules True and False and has no expected value (decision 3).
  - node: test/rules/std_LT04_ST06_test.py::test_rule_st06_simple_expression_helpers_reject_non_simple_segments
    class: python-internal
    reason: It calls Linter.parse_string and 2 helper methods of Rule_ST06 on a parsed segment, and calls no CLI command and no simple-API function.
  - node: test/rules/yaml_test_cases_test.py::test__rule_test_global_config
    class: python-internal
    reason: It calls the Python test helper load_test_cases on a YAML file and calls no CLI command and no simple-API function.
  - node: test/rules/std_JJ01_test.py::test_lint_jj01_pickled_config
    class: python-internal
    reason: It calls Linter.parse_path and Rule.crawl with a pickled config, and calls no CLI command and no simple-API function.
  - node: test/rules/std_LT01_jinja_alignment_test.py::test_lt01_alias_alignment_with_jinja_uses_source_positions
    class: needs-python-runtime
    reason: Its Jinja context has 2 Python functions (generate_surrogate_key and ref), which a config file cannot give.
