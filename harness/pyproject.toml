[project]
name = "sqll-harness"
version = "0.1.0"
description = "Binary test harness for sqll, sqlfluff, and sqruff."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml>=6.0.2",
    "tomli-w>=1.2.0",
]

[project.scripts]
sqll-harness = "sqll_harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.14.0",
]

# uv builds the harness with its own build backend when uv_build matches its
# version. Thus "uv sync" needs no download in the CI image.
[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sqll_harness"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sqll_harness"]
