# sqlfluff sorts the PRS of a bad noqa comment as if it is at position 0 of
# its line. "ignore: parsing" hides it from the other checks.
expect_pass_bad_noqa_order:
  fail_str: "SELECT a FROM t AS x JOIN u AS x -- noqa AL04\n"
  configs:
    core:
      ignore: parsing
  violations:
    - start_line_no: 1
      start_line_pos: 34
      code: PRS
      description: "Malformed 'noqa' section. Expected 'noqa: <rule>[,...]"
      name: ""
      warning: false
      start_file_pos: 33
      end_line_no: 1
      end_line_pos: 46
      end_file_pos: 45
    - start_line_no: 1
      start_line_pos: 32
      code: AL04
      description: Duplicate table alias 'x'. Table aliases should be unique.
