# Harness test cases. They are not sqlfluff fixtures.
# "violations" is compared with all violations, with no "ignore" or noqa
# filter. AL04 gives no fixes, so the fix check passes with no fix_str. The
# key prefix gives the result of the sqlfluff test
# (scripts/sqlfluff-rule-oracle).
rule: AL04

expect_pass_ignore_parsing_all_violations:
  fail_str: "SELECT a FROM t AS x JOIN u AS x;\nfoo bar baz;\n"
  configs:
    core:
      ignore: parsing
  violations:
    - start_line_no: 1
      start_line_pos: 32
      code: AL04
      description: Duplicate table alias 'x'. Table aliases should be unique.
      name: aliasing.unique.table
      warning: false
      fixes: []
      start_file_pos: 31
      end_line_no: 1
      end_line_pos: 33
      end_file_pos: 32
    - start_line_no: 2
      start_line_pos: 1
      code: PRS
      description: "Line 2, Position 1: Found unparsable section: 'foo bar baz;'"
      name: ""
      warning: false
      start_file_pos: 34
      end_line_no: 2
      end_line_pos: 13
      end_file_pos: 46

expect_fail_ignore_parsing_filtered_violations:
  fail_str: "SELECT a FROM t AS x JOIN u AS x;\nfoo bar baz;\n"
