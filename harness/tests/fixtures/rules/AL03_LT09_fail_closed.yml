# Harness test cases. They are not sqlfluff fixtures.
# The sqlfluff test fails on each case (key prefix expect_fail_). The harness
# must give status "error", not "pass".
rule: AL03,LT09

# In fix mode the test applies the LT09 fix. The LT09 error is in a templated
# area, so remove_templated_errors removes it after the fix loop. No shown
# violation has fixes, so "sqlfluff fix" does not write the file.
expect_fail_templated_area_fix_no_fix_str:
  fail_str: "SELECT RO(), {{ \"t\" }}.func()\n"
